services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-otomo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe123!}
      POSTGRES_DB: ${POSTGRES_DB:-otomo}
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - db:/var/lib/postgresql

volumes:
  db:
